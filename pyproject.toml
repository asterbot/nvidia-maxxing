[project]
name = "maxxing"
version = "0.1.0"
description = "Autonomous outage triage agent: detects outages, gathers evidence, runs a local Nemotron RCA agent, and prints the root cause and culprit commit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "docker>=7.1",
    "GitPython>=3.1.43",
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
maxxing = "maxxing.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maxxing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "llm: requires a reachable local LLM (Ollama/NIM); skipped otherwise",
]
